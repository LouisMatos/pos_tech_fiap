name: Deploy

# Deploy manual dedicado. Nunca dispara sozinho - so via "Run workflow" (workflow_dispatch).
# CI (ci.yml) testa/publica a imagem automaticamente; fazer deploy e sempre acao humana.
# So existe overlay k8s/overlays/prod hoje (monolito legado, sem modelo dev/hom),
# entao environment fica limitado a prod ate que outros overlays existam.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        required: true
        type: choice
        options:
          - prod
      image_tag:
        description: 'Tag da imagem ja publicada no ECR (ex: SHA do commit)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Confirma imagem existe no ECR
        run: |
          aws ecr describe-images --repository-name jlapp-monolith --image-ids imageTag="${{ inputs.image_tag }}" > /dev/null

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name jlapp-cluster

      - name: Set image tag in overlay
        run: |
          IMAGE_REPO="${{ steps.login-ecr.outputs.registry }}/jlapp-monolith"
          cat >> k8s/overlays/${{ inputs.environment }}/kustomization.yaml <<EOF
          images:
            - name: jlapp-monolith
              newName: ${IMAGE_REPO}
              newTag: ${{ inputs.image_tag }}
          EOF

      - name: Deploy via Kustomize
        run: |
          kubectl apply -k k8s/overlays/${{ inputs.environment }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/jlapp-deployment -n default --timeout=120s
