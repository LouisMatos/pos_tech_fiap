name: Deploy to AWS EKS

# This repo (legacy monolith, being phased out in favor of the choreographed
# microservices) only ever deploys to a single target from `master` — unlike
# the newer services there is no dev/hom/prod branch model here, so this
# workflow does not carry a resolve-env job. Build/test still run on every
# push and PR; publish/deploy are gated to `master` pushes only.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  id-token: write   # required for OIDC (aws-actions/configure-aws-credentials)

jobs:

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'adopt'
          cache: maven
      - run: mvn verify

  build:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'adopt'
          cache: maven
      - name: Package
        run: mvn package -DskipTests

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: image
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/jlapp-monolith:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.image }}"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name jlapp-cluster

      - name: Set image tag in overlay
        run: |
          IMAGE_FULL="${{ needs.publish.outputs.image }}"
          IMAGE_REPO="${IMAGE_FULL%:*}"
          IMAGE_TAG="${IMAGE_FULL##*:}"
          cat >> k8s/overlays/prod/kustomization.yaml <<EOF
          images:
            - name: jlapp-monolith
              newName: ${IMAGE_REPO}
              newTag: ${IMAGE_TAG}
          EOF

      - name: Deploy via Kustomize
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/jlapp-deployment -n default --timeout=120s
